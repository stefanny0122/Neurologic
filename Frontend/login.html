<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en NEUROLOGIC.">
  <title>Iniciar sesión | NEUROLOGIC</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-illustration">
      <img src="assets/img/logo-neurologic.png" alt="NEUROLOGIC" class="auth-logo">
      <span class="auth-kicker">APRENDE A TU RITMO</span>
      <h1>¡Las matemáticas pueden ser divertidas!</h1>
      <p>Explora desafíos, juega y descubre todo lo que eres capaz de aprender.</p>
      <div class="auth-math" aria-hidden="true"><span>＋</span><span>÷</span><span>×</span><span>＝</span></div>
    </section>
    <section class="auth-card">
      <a class="auth-brand" href="login.html">NEUROLOGIC <span>💙</span></a>
      <h2>¡Qué bueno tenerte de vuelta!</h2>
      <p class="auth-subtitle">Ingresa a tu espacio de aprendizaje.</p>
      <form id="login-form" novalidate>
        <label for="login-correo">Correo electrónico</label>
        <input id="login-correo" name="correo" type="email" autocomplete="email" placeholder="tu@correo.com" required>
        <label for="login-password">Contraseña</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>
        <p id="login-message" class="auth-message" role="alert" aria-live="polite"></p>
        <button class="auth-submit" type="submit" id="login-submit">Iniciar sesión</button>
      </form>
      <p class="auth-switch">¿Aún no tienes una cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
