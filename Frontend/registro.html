<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | NEUROLOGIC</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <main class="auth-shell auth-shell-register">
    <section class="auth-illustration">
      <img src="assets/img/logo-neurologic.png" alt="NEUROLOGIC" class="auth-logo">
      <span class="auth-kicker">COMIENZA TU AVENTURA</span>
      <h1>¡Cada reto es una oportunidad para aprender!</h1>
      <p>Crea tu cuenta y empieza a fortalecer tus habilidades matemáticas jugando.</p>
      <div class="auth-math" aria-hidden="true"><span>＋</span><span>÷</span><span>×</span><span>＝</span></div>
    </section>
    <section class="auth-card">
      <a class="auth-brand" href="login.html">NEUROLOGIC <span>💙</span></a>
      <h2>Crea tu cuenta</h2>
      <p class="auth-subtitle">Completa tus datos para comenzar.</p>
      <form id="register-form" novalidate>
        <label for="register-nombre">Nombre completo</label>
        <input id="register-nombre" name="nombre" type="text" maxlength="100" autocomplete="name" placeholder="Escribe tu nombre" required>
        <label for="register-correo">Correo electrónico</label>
        <input id="register-correo" name="correo" type="email" maxlength="150" autocomplete="email" placeholder="tu@correo.com" required>
        <label for="register-birth">Fecha de nacimiento</label>
        <input id="register-birth" name="fecha_nacimiento" type="date" required>
        <label for="register-password">Contraseña</label>
        <input id="register-password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
        <label for="register-confirm">Confirmar contraseña</label>
        <input id="register-confirm" name="confirmarPassword" type="password" minlength="8" autocomplete="new-password" placeholder="Repite tu contraseña" required>
        <p id="register-message" class="auth-message" role="alert" aria-live="polite"></p>
        <button class="auth-submit" type="submit" id="register-submit">Crear cuenta</button>
      </form>
      <p class="auth-switch">¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
